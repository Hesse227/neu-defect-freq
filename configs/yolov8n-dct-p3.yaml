# YOLOv8n + DCT attention only on P3 (A2: single insertion after the P3 C2f).
# Hypothesis under test: the gain concentrates on the small-object stride
# (P3/8), where NEU-DET's fine defects (crazing, pitted_surface) live.
nc: 6
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, DCTAttention, [64]]     # 5 <-- P3 only
  - [-1, 1, Conv, [512, 3, 2]]      # 6-P4/16
  - [-1, 6, C2f, [512, True]]       # 7
  - [-1, 1, Conv, [1024, 3, 2]]     # 8-P5/32
  - [-1, 3, C2f, [1024, True]]      # 9
  - [-1, 1, SPPF, [1024, 5]]        # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 7], 1, Concat, [1]]                   # 12
  - [-1, 3, C2f, [512]]                         # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 5], 1, Concat, [1]]                   # 15 (P3, after attention)
  - [-1, 3, C2f, [256]]                         # 16 (P3/8-out)

  - [-1, 1, Conv, [256, 3, 2]]                  # 17
  - [[-1, 13], 1, Concat, [1]]                  # 18
  - [-1, 3, C2f, [512]]                         # 19 (P4/16-out)

  - [-1, 1, Conv, [512, 3, 2]]                  # 20
  - [[-1, 10], 1, Concat, [1]]                  # 21
  - [-1, 3, C2f, [1024]]                        # 22 (P5/32-out)

  - [[16, 19, 22], 1, Detect, [nc]]             # 23
