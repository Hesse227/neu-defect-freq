# YOLOv8n + multi-spectral DCT channel attention (A1: P3 + P4 + P5).
# Attention is inserted right after the C2f blocks that produce the P3/P4/P5
# backbone features, so both the downsample path and the lateral (concat) path
# see the reweighted features.
# NOTE: the channel args (64/128/256) are the *post-scale* widths for the `n`
# scale (width_multiple=0.25). Using another scale requires updating them.
nc: 6
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4
  - [-1, 1, DCTAttention, [64]]     # 5  <-- freq attention on P3 features
  - [-1, 1, Conv, [512, 3, 2]]      # 6-P4/16
  - [-1, 6, C2f, [512, True]]       # 7
  - [-1, 1, DCTAttention, [128]]    # 8  <-- P4
  - [-1, 1, Conv, [1024, 3, 2]]     # 9-P5/32
  - [-1, 3, C2f, [1024, True]]      # 10
  - [-1, 1, DCTAttention, [256]]    # 11 <-- P5
  - [-1, 1, SPPF, [1024, 5]]        # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 8], 1, Concat, [1]]                   # 14 (P4, after attention)
  - [-1, 3, C2f, [512]]                         # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 16
  - [[-1, 5], 1, Concat, [1]]                   # 17 (P3, after attention)
  - [-1, 3, C2f, [256]]                         # 18 (P3/8-out)

  - [-1, 1, Conv, [256, 3, 2]]                  # 19
  - [[-1, 15], 1, Concat, [1]]                  # 20
  - [-1, 3, C2f, [512]]                         # 21 (P4/16-out)

  - [-1, 1, Conv, [512, 3, 2]]                  # 22
  - [[-1, 12], 1, Concat, [1]]                  # 23
  - [-1, 3, C2f, [1024]]                        # 24 (P5/32-out)

  - [[18, 21, 24], 1, Detect, [nc]]             # 25
